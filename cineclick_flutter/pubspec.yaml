name: cineclick_flutter
description: CinéClick — Flutter OTT Streaming Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # State management
  provider: ^6.1.2

  # Video
  video_player: ^2.8.6
  chewie: ^1.7.5

  # Media picking
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1

  # UI
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
